# Release: build one full SideNbr zip; on tag v* attach to GitHub Release.
#
# Zip: SideNbr-<version>.zip
#
# See docs/DOWNLOAD.md for install steps.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build & package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${VERSION}"

      - name: Build
        run: npm run build

      - name: Verify dist
        run: npm run check-build

      - name: Pack zip
        run: node scripts/package-dist.mjs

      - name: List artifacts
        run: |
          ls -la artifacts/
          sha256sum artifacts/*.zip || shasum -a 256 artifacts/*.zip

      - name: Upload GitHub Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SideNbr-${{ steps.meta.outputs.version }}
          path: artifacts/SideNbr-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SideNbr ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## SideNbr ${{ github.ref_name }}

            Pre-built Chrome extension (Manifest V3). Open-source only — not for Chrome Web Store.

            1. Download **`SideNbr-${{ steps.meta.outputs.version }}.zip`**
            2. Unzip
            3. Chrome → `chrome://extensions` → Developer mode → **Load unpacked**

            See [docs/DOWNLOAD.md](https://github.com/VicZhang6/SideNbr/blob/main/docs/DOWNLOAD.md).
          files: |
            artifacts/SideNbr-${{ steps.meta.outputs.version }}.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
